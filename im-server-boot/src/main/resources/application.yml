spring:
  application:
    name: im-server
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  # IM 服务对外暴露的 gRPC：
  #   im.ingress.v1.MessageIngress -> SubmitMessage / BatchSubmit / PullPending（网关调用）
  grpc:
    server:
      host: 0.0.0.0
      port: ${IM_GRPC_PORT:9091}
      # grpc.health.v1.Health：网关的健康检查订阅它，NOT_SERVING 的实例会被摘出 round_robin。
      # 状态由 Actuator 健康聚合按 schedule.period 刷新（启动未就绪 → NOT_SERVING，就绪 → SERVING）。
      # 生效前提：classpath 上有 io.grpc:grpc-services（见 im-server/pom.xml）。
      health:
        enabled: true
        include-overall-health: true
        schedule:
          # 首次同步不要等默认的 5s：未同步前 HealthStatusManager 默认报 SERVING，
          # 会把还没就绪的实例算成可用。这里 1s 内就翻成真实状态。
          delay: ${IM_GRPC_HEALTH_DELAY:1s}
          period: ${IM_GRPC_HEALTH_PERIOD:2s}

# 独立部署时建议 8088：与网关的 8080 区分，便于同机联调时一眼看出进程角色
server:
  port: ${SERVER_PORT:8088}

# 健康探针：优雅停机时 readiness 会转成 REFUSING_TRAFFIC，聚合健康随之变 OUT_OF_SERVICE，
# 再经 spring.grpc.server.health 的默认映射变成 NOT_SERVING——网关在实例真正退出前就不再给它发消息。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

im:
  # —— 消息存储形态 ——
  #   redis（默认）: Redis List，零外部数据库依赖，本地开发/联调
  #   jdbc         : MySQL（im-storage-jdbc 模块），生产形态；需要配下面 im.db.*
  storage: ${IM_STORAGE:jdbc}
  db:
    url: ${IM_DB_URL:jdbc:mysql://127.0.0.1:3306/im-cluster?useSSL=true&useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&failOverReadOnly=false}
    username: ${IM_DB_USERNAME:root}
    password: ${IM_DB_PASSWORD:root}
    pool-size: ${IM_DB_POOL_SIZE:20}
    # 首次启动自动建表；生产建议 false，交给 Flyway/Liquibase
    init-schema: ${IM_DB_INIT_SCHEMA:true}
    # group commit：并发到达的插入合并成一个事务提交，把每条一次的 fsync 摊薄成 1/N。
    # 只在「已经有消息在排队」时合批，所以稀疏写入没有额外延迟；关掉可对照压测。
    batch-enabled: ${IM_DB_BATCH_ENABLED:true}
  push:
    # 下发到网关实例的超时：超时即视为失败 -> 落离线，不做无限重试
    timeout-ms: ${IM_PUSH_TIMEOUT_MS:800}
    # 下行不等待网关就绪：失败即落离线、客户端上线补发，比占着线程等更划算
    wait-for-ready: ${IM_PUSH_WAIT_FOR_READY:false}
  delivery:
    # 下行推送与 ack 解耦：落库成功后立刻回 ack，推送在虚拟线程池里异步完成。
    # 并发打满时退化成同步推送（宁可 ack 慢几十毫秒，也不让推送任务把堆内存堆穿）。
    max-inflight: ${IM_DELIVERY_MAX_INFLIGHT:1024}
  # —— 投递前准入（ACL）——
  #   off（默认）: 不校验，零额外往返
  #   warn       : 校验并记日志，但一律放行（上线前观察本该拦掉多少）
  #   enforce    : 校验失败即 403（群聊要求发送者是成员；单聊查黑名单，可选查好友）
  acl:
    mode: ${IM_ACL_MODE:off}
    # 单聊是否要求双方是好友。开放社交不要求；企业/内部 IM 通常要求（关系由组织架构同步）
    require-friend: ${IM_ACL_REQUIRE_FRIEND:false}
  # —— 存储分片 ——
  # conversationId 是唯一的分片键：Redis 侧所有会话 key 共用 {conversationId} hash tag，
  # MySQL 侧的物理切分见 db/schema-shard.sql。默认 1 = 不分片，行为与改造前完全一致。
  shard:
    count: ${IM_SHARD_COUNT:1}
  # —— 租户（appId）维度 ——
  # Redis key 的根前缀：默认 im，配成 acme 得到 acme:im:…。
  # 进程级配置（多租户按实例隔离），网关与 IM 服务必须配同一个值，否则下行推送会静默判定「不在线」。
  tenant:
    app-id: ${IM_TENANT_APP_ID:}
  # —— 消息生命周期 ——
  recall:
    # 撤回时限。没有时限的撤回等于允许事后修改双方共同的历史，那是「编辑」而不是「撤回」。
    # 群管理员撤回他人消息需要群角色，暂未实现。
    window: ${IM_RECALL_WINDOW:2m}
  # 变更事件（下行 msg.update：RECALLED / DELETED）。关闭后客户端只能靠重新拉历史得知。
  message-events:
    enabled: ${IM_MESSAGE_EVENTS_ENABLED:true}
  # —— 消息状态回执（下行 msg.state：DELIVERED / READ）——
  # 对端确认收到 / 上报已读之后，向会话对端（发送方）推一条状态帧。
  # 只推单聊：群聊的「已读」是按人统计的集合，扇出是「成员数 × 消息数」，另属一个模型。
  state-receipt:
    enabled: ${IM_STATE_RECEIPT_ENABLED:true}
  # —— 厂商推送（离线通知）——
  # 长连接投不到的用户（进程被杀 / 后台冻结 / 设备休眠）只有厂商通道能叫醒 App。
  # 默认关闭：没有中转服务时不该有任何网络调用，也不该在启动日志里出现连不上的告警。
  # 本服务只声明「推给谁、推什么」，APNs/FCM/华为/小米各自的鉴权与签名交给中转服务，
  # 否则消息服务的发布节奏会被推送 SDK 绑死。
  vendor-push:
    enabled: ${IM_VENDOR_PUSH_ENABLED:false}
    endpoint: ${IM_VENDOR_PUSH_ENDPOINT:}
    token: ${IM_VENDOR_PUSH_TOKEN:}
    timeout: ${IM_VENDOR_PUSH_TIMEOUT:3s}
  node:
    # 本实例 gRPC 对外地址：注册到 Nacos 的就是 ip:grpc-port（网关调用的是 gRPC，不是 HTTP）
    # grpc-host 留空则自动探测（POD_IP -> 本机首个非回环 IPv4 -> 127.0.0.1）
    grpc-host: ${IM_GRPC_HOST:}
    grpc-port: ${IM_GRPC_PORT:9091}
    grpc:
      # 客户端健康检查（本方向是 IM → 网关的下行推送）：排除「连得上但 NOT_SERVING」的网关，
      # 典型场景是网关正在优雅摘流（drain）或还没就绪。要求对端已实现 grpc.health.v1.Health。
      health-check-enabled: ${IM_GRPC_HEALTH_CHECK:true}
      tls:
        enabled: ${IM_GRPC_TLS:false}
        trust-cert: ${IM_GRPC_TRUST:}
  # —— 注册中心：让网关发现「有哪几个 IM 服务实例」——
  # 关闭或注册失败时只影响多实例分摊，不影响本实例处理请求（网关会回退到静态 im.server.address）。
  nacos:
    enabled: ${IM_NACOS_ENABLED:true}
    server-addr: ${IM_NACOS_ADDR:127.0.0.1:8848}
    namespace: ${IM_NACOS_NAMESPACE:}
    # 注册用的 IP，必须是对端可直连的地址；留空则自动探测
    # （不能用 spring.grpc.server.host=0.0.0.0，那是监听地址不是可达地址）
    register-ip: ${IM_NACOS_REGISTER_IP:}
    server:
      # 本实例注册成什么服务名；网关按同名订阅
      service-name: ${IM_NACOS_SERVER_SERVICE:im-server}
