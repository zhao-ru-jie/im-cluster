spring:
  application:
    name: im-node
  # 开启虚拟线程（JDK 21+），充分利用你的 JDK 25 环境
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      # password: xxx
  # Spring Boot 4.1 官方 gRPC 服务（节点间转发用）
  # host 固定绑定 0.0.0.0：监听所有网卡，pod 网络内其他节点才能连上。
  # 对外「可达地址」（节点 ID）由 NodeAddressResolver 自动探测（K8s 下为 POD_IP），不要在这里写死。
  grpc:
    server:
      host: 0.0.0.0
      port: ${IM_GRPC_PORT:9090}

server:
  port: 8080

im:
  node:
    # 节点 ID 不需要手动指定：自动 = 探测到的可达地址:grpc-port
    # 探测优先级见 NodeAddressResolver：IM_GRPC_HOST 手动覆盖 -> K8s POD_IP -> POD_NAME -> 本机非回环 IP -> 127.0.0.1
    # 与 spring.grpc.server.port 保持一致
    grpc-port: ${IM_GRPC_PORT:9090}
    # 跨机/物理部署时可手动指定可达 IP/域名；K8s 下留空，由 POD_IP 自动探测（不要写 127.0.0.1）
    grpc-host: ${IM_GRPC_HOST:}
    grpc:
      # 是否启用 gRPC TLS；true 时需配合 application-tls.yml 与证书（--spring.profiles.active=tls）
      tls:
        enabled: ${IM_GRPC_TLS:false}
        # 客户端信任的服务端证书（PEM），如 classpath:grpc/server.crt 或文件路径
        trust-cert: ${IM_GRPC_TRUST:}
  # —— Nacos-Client 动态发现（可选，默认关闭）——
  # 启用后：每个节点把自己的 gRPC 地址(ip:port)注册到 Nacos，转发前按 nodeId 从 Nacos 查出
  # 实时健康地址再 dial。关闭时直接用 nodeId(host:port) 兜底，零侵入。
  # 注意：per-user 路由(userId→节点) 仍由 Redis 持有，Nacos 只负责「节点 IP 发现」。
  nacos:
    enabled: ${IM_NACOS_ENABLED:false}
    server-addr: ${IM_NACOS_ADDR:127.0.0.1:8848}
    service-name: im-grpc-nodes
    namespace: ${IM_NACOS_NAMESPACE:}
