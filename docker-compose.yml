# IM 集群演示用中间件：Redis（路由表 + 离线消息）+ Nacos（节点 gRPC 地址动态发现）
# 启动： docker compose up -d
# 停止： docker compose down
services:
  redis:
    image: redis:7-alpine
    container_name: im-cluster-redis
    ports:
      - "6379:6379"
    # 不设置密码，与 application.yml 默认配置一致
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Nacos（独立模式）：用于演示「节点 gRPC 地址动态发现」。
  # 不启用 Nacos 也能跑（默认 im.nacos.enabled=false，转发回退为直接用 nodeId）。
  # 启用方式：启动时设置环境变量 IM_NACOS_ENABLED=true IM_NACOS_ADDR=127.0.0.1:8848
  nacos:
    image: nacos/nacos-server:v2.5.1
    container_name: im-cluster-nacos
    environment:
      - MODE=standalone
      - NACOS_AUTH_ENABLE=false
    ports:
      - "8848:8848"   # Nacos HTTP 控制台 / 配置 / 注册发现主端口
      - "9848:9848"   # Nacos 2.x gRPC 客户端端口（nacos-client SDK 需要）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure
