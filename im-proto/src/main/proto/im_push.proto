syntax = "proto3";

package im.push.v1;

option java_package = "com.github.im.proto.push.v1";
option java_multiple_files = true;
option java_outer_classname = "ImPushProto";

// ============================================================================
// 下行契约：IM 业务服务(im-server) -> 长连接服务(im-gateway)
//
// 设计要点：
//  * frame 已是「可直接发给客户端的完整下行帧」，网关只做透传、不反序列化，
//    因此 IM 侧业务演进（新增已读回执、卡片消息等）不需要改动网关；
//  * 网关按 userId 定位本地会话，找不到即计入 failed_user_ids，
//    由 IM 服务转离线存储——网关不承担「是否离线」的判定；
//  * ttl_ms 用于丢弃陈旧消息，避免网关重启后补推一堆过期帧。
//
// 注：常驻双向流 Connect(stream PushAck) returns (stream PushTask) 在阶段 3
//    （网关独立部署）随连接复用需要一并加入；阶段 1/2 使用一元 Push 已满足语义。
// ============================================================================
service DownstreamPush {
  rpc Push(PushTask) returns (PushResult);
}

message PushTask {
  string trace_id = 1;
  repeated string target_user_ids = 2; // 推送目标（只到用户粒度，设备粒度由 frame 表达）
  string frame = 3;                    // 已序列化的下行帧，网关原样透传
  int32 priority = 4;                  // 0=普通 1=高优（心跳/踢下线等）
  int32 ttl_ms = 5;                    // 过期时间，<=0 表示不过期
  string conversation_id = 6;
}

message PushResult {
  repeated string delivered_user_ids = 1;
  repeated string failed_user_ids = 2; // 未投递成功（离线/非本实例），由 IM 服务落离线
}
