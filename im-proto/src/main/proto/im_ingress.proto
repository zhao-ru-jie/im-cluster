syntax = "proto3";

package im.ingress.v1;

option java_package = "com.github.im.proto.ingress.v1";
option java_multiple_files = true;
option java_outer_classname = "ImIngressProto";

// ============================================================================
// 上行契约：长连接服务(im-gateway) -> IM 业务服务(im-server)
//
// 设计要点：
//  * 网关只负责「把客户端帧原样上报」，不理解 payload 里的业务语义；
//  * 客户端幂等键 client_msg_id 是唯一去重依据，IM 服务负责判定重复并返回同一
//    server_msg_id / seq，因此本接口天然可重试（至少一次投递）；
//  * seq 由 IM 服务按 conversation_id 单调分配，网关不得自行生成或重排。
// ============================================================================
service MessageIngress {
  // 单条上行（实时路径，延迟最低）
  rpc SubmitMessage(SubmitMessageRequest) returns (SubmitMessageResponse);

  // 批量上行（高吞吐路径：网关侧攒批后一次提交，减少 RPC 次数）
  rpc BatchSubmit(BatchSubmitRequest) returns (BatchSubmitResponse);

  // 连接建立时拉取该用户待补发的消息帧（离线消息 / 多端漫游缺口），
  // 同时接收客户端上报的各会话消费水位（watermarks）：既可给 seq 发号器兜底下界，
  // 也是群聊离线补发的起点（客户端已经收过的 seq 不再重发）。
  //
  // 群聊离线不按人存帧（一条群消息 = 全体不在线成员份相同内容，会随消息数线性膨胀），
  // 只按「用户 × 会话」记一个待补发 seq；帧由本接口按该 seq 区间从会话历史重建，
  // 结构与实时推送的 msg.push 完全一致。
  //
  // 关键语义：本接口 **只读不移除**。返回的帧要等网关真的写进连接之后，再调 AckPending
  // 推进游标；网关写失败/进程崩溃则不 ack，下次重连从原位置重读（客户端按 seq 去重）。
  // 这就是「离线补发至少一次」的实现方式——在此之前 drain 是破坏性读，写失败即丢。
  rpc PullPending(PullPendingRequest) returns (PullPendingResponse);

  // 确认一批补发帧已经写进客户端连接（至少一次投递的「确认」半程）。
  //
  // 为什么确认放在网关而不是 IM 服务：只有网关知道 writeAndFlush 是否成功、连接是否还活着。
  // 为什么不做成「每条帧一个 ACK」：补发天然是一批（一次 PullPending 的产物），
  // 逐帧确认会把 RPC 次数放大到帧数级别；而客户端本身已有「按 seq 去重」的硬约定，
  // 批量确认最多导致重复补发，不会丢。
  rpc AckPending(AckPendingRequest) returns (AckPendingResponse);
}

message SubmitMessageRequest {
  string trace_id = 1;        // 全链路追踪 ID，网关生成
  string client_msg_id = 2;   // 客户端幂等键（必填，重复提交返回同一结果）
  string from_user_id = 3;    // 发送方
  string device_id = 4;       // 发送设备（多端同步 / 已读合并用）
  string conversation_id = 5; // 会话 ID；单聊缺省由服务端按 (from,to) 规范生成
  string conv_type = 6;       // SINGLE / GROUP
  string receiver_id = 7;     // 单聊接收方；群聊留空（群成员由 IM 服务解析）
  string payload = 8;         // 业务消息体，网关不解析
  int64 client_ts = 9;        // 客户端发送时间（毫秒），仅作参考
  string gateway_instance = 10; // 上报方网关实例 ID，回推时优先走该实例
}

message SubmitMessageResponse {
  int32 code = 1;             // 0=成功；4xx=可重试；5xx=拒收（不要重试）
  string message = 2;         // 错误描述
  string server_msg_id = 3;   // 服务端消息 ID（幂等：同一 client_msg_id 恒定）
  int64 seq = 4;              // 会话内单调递增序号（保序与拉齐依据）
  int64 server_ts = 5;        // 服务端接收时间
  string client_msg_id = 6;   // 回显，供网关匹配 ACK
  bool duplicate = 7;         // true=幂等命中（未重复落库）
}

message BatchSubmitRequest {
  repeated SubmitMessageRequest messages = 1;
}

message BatchSubmitResponse {
  repeated SubmitMessageResponse results = 1;
}

message PullPendingRequest {
  string user_id = 1;
  int32 max = 2;              // 单次最多拉取条数，0 表示默认值

  // 客户端上报的「会话 -> 已见过的最大 seq」消费水位。
  //
  // 为什么服务端需要它：seq 发号器的下界取「已落库的最大 seq」。当消息存储与发号器
  // 共用同一个 Redis 且整体丢失（无持久化 / FLUSH / 回滚到旧快照）时，这个下界会一起消失，
  // seq 从 1 重新开始——此时客户端水位是**唯一还活着的证据**：它证明「这些 seq 已经被消费过」，
  // 服务端据此把下界抬到水位之上，避免发出比客户端水位更小的 seq（否则新消息会被客户端
  // 判定为历史重复而丢弃，表现为「消息永久不显示」）。
  //
  // 语义：可空、可只报部分会话、可重复上报（服务端按 conversation 取最大值）。
  map<string, int64> watermarks = 3;

  // 补发所属设备（WS 的 deviceId / TCP connect 帧的 deviceId；缺省按 "default"）。
  //
  // 为什么补发必须知道设备：离线队列现在是「读不删 + 按游标确认」，
  // 游标必须是 per-device 的——手机和网页各自补到哪互不相干。用用户级单一游标时，
  // 先上线的设备一确认，另一个设备就永远补不到那段消息（这正是之前的 at-most-once 来源之一）。
  string device_id = 4;
}

message PullPendingResponse {
  repeated string frames = 1; // 已序列化的下行帧，网关原样透传给客户端
  int32 remaining = 2;        // 仍滞留待拉取的数量（用于决定是否继续拉）：
                              // 单聊按帧计，群聊按「还有待补消息的会话数」计（不逐条数历史）

  // —— 以下两个字段是「本批帧的确认位置」，网关在全部写成功后原样回传给 AckPending ——
  //
  // 0 / 空 map 表示本批没有需要确认的东西（没有帧、或全部来自旧结构的一次性迁移读）。
  int64 ack_single_seq = 3;               // 单聊：本批覆盖到的最大 seq
  map<string, int64> ack_group_seqs = 4;  // 群聊：conversation_id -> 本批补到哪（下一条待补的 seq）
}

message AckPendingRequest {
  string user_id = 1;
  string device_id = 2;                     // 与 PullPendingRequest.device_id 一致，定位游标
  int64 ack_single_seq = 3;                 // 原样回传 PullPendingResponse.ack_single_seq
  map<string, int64> ack_group_seqs = 4;    // 原样回传 PullPendingResponse.ack_group_seqs
}

message AckPendingResponse {
  int32 code = 1;            // 0=已推进；其它值仅用于观测（确认失败不影响正确性，最多重复补发）
  string message = 2;
  int64 single_cursor = 3;   // 推进后的单聊游标，便于网关日志对账
}
